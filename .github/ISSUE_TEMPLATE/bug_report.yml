# Bug report form — something in the office is wrong or does not match what Antigravity is doing
name: Bug report
description: Something in the office is wrong, or does not match what Antigravity is doing
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear sentence or two. If the office shows something different from what Antigravity did, say what each one showed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: dropdown
    id: how-run
    attributes:
      label: How you run the office
      options:
        - npx antigravity-office
        - Desktop app
        - From a checkout (npm run …)
        - Antigravity plugin
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Office version
      description: The desktop app's About box, or `git log -1 --oneline` in a checkout
      placeholder: "1.3.0"
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Windows (native)
    validations:
      required: true
  - type: dropdown
    id: ai-tool
    attributes:
      label: Which AI tool
      options:
        - Antigravity
        - Other
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      description: "`node --version` (the office needs Node 22 or newer)"
  - type: input
    id: agy-version
    attributes:
      label: Antigravity version
      description: "`agy --version`"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: "Output of `npm run doctor`, the server's terminal output or `~/.agent-office/server.log` (`--detach` only), `~/.agent-office/chat-ai.log`, or a screenshot. Strip anything private."
