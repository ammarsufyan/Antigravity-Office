# Feature request form — something the office should show or do; open-ended ideas go to Discussions › Ideas
name: Feature request
description: Something the office should show or do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Not sure yet, or want votes first? Start it in [Discussions › Ideas](https://github.com/ammarsufyan/Antigravity-Office/discussions/categories/ideas).
        Features that reflect something Antigravity really does (a hook event, a transcript metric, a state) come first; see CONTRIBUTING.md.
  - type: textarea
    id: what
    attributes:
      label: What should the office do
      description: One paragraph.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you would do with it, or what you are missing today.
  - type: dropdown
    id: how-run
    attributes:
      label: How you run the office
      options:
        - npx antigravity-office
        - Desktop app
        - From a checkout (npm run …)
        - Antigravity plugin
  - type: dropdown
    id: ai-tool
    attributes:
      label: Which AI tool
      options:
        - Antigravity
        - Other
  - type: input
    id: fork
    attributes:
      label: Built it in a fork already? Link it
      placeholder: https://github.com/you/Antigravity-Office/tree/your-branch
  - type: checkboxes
    id: build
    attributes:
      label: Building it
      options:
        - label: I'd like to build this
