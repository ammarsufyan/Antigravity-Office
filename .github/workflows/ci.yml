name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          # The Electron binary is not needed for type-checking or tests
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Type-check
        # src/config.ts imports office.config.json, which is gitignored
        run: |
          cp office.config.example.json office.config.json
          npx tsc --noEmit -p .

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      - name: Check assets
        run: npm run check-assets

  antigravity-cross-platform:
    name: Antigravity hook on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Run Antigravity & CLI tests
        run: npx vitest run tests/antigravity.test.ts tests/install-tool-hooks.test.ts tests/doctor.test.ts tests/cli.test.ts tests/tool-hooks.test.ts tests/tool-translators.test.ts tests/chat-prompts.test.ts
